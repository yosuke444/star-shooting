<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STAR SHOOTING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  /* 描画キャンバスは 960x540 固定。縦横比を保ったまま拡大縮小(引き伸ばし無し) */
  #game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #07071a; }
  #entry { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); flex-direction: column; gap: 12px; font-family: "DotGothic16", monospace; color: #fff; z-index: 10; }
  #entry .box { background: #14143a; border: 3px solid #ffe14d; padding: 20px 26px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  #entryInput { font-family: inherit; font-size: 28px; padding: 6px 10px; width: 300px; background: #07071a; color: #fff; border: 2px solid #8a8ad0; text-align: center; }
  #entryOk { font-family: inherit; font-size: 18px; padding: 6px 24px; background: #ffe14d; color: #0b0b18; border: none; cursor: pointer; }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<div id="entry"><div class="box"><div id="entryLabel"></div><input id="entryInput" autocomplete="off"><button id="entryOk">OK (Enter)</button></div></div>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/world.js"></script>
<script src="js/fx.js"></script>
<script src="js/sim.js"></script>
<script src="js/events.js"></script>
<script src="js/ai.js"></script>
<script src="js/render.js"></script>
<script src="js/hud.js"></script>
<script src="js/net.js"></script>
<script src="js/main.js"></script>
</body>
</html>
